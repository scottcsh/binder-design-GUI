[project]
name = "protein-agent"
version = "0.1.0"
description = "Natural-language workflow compiler for protein binder design"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "typer>=0.12",
    "rich>=13.7",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.scripts]
pbind = "app.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["data*"]
