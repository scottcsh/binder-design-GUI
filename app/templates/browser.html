<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Browse</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial,sans-serif;margin:0;padding:16px;background:#fafafa;}
h1{margin:0 0 12px 0;font-size:22px;}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px;}
.path-box{flex:1 1 600px;padding:8px 10px;border:1px solid #bbb;border-radius:6px;background:#fff;word-break:break-all;}
button{padding:10px 14px;border:1px solid #999;border-radius:8px;background:#f5f5f5;cursor:pointer;}
.list{border:1px solid #ddd;border-radius:10px;background:#fff;overflow:hidden;}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:10px 12px;border-top:1px solid #eee;}
.row:first-child{border-top:none;}
.name{min-width:0;word-break:break-all;}
.dir{font-weight:600;}
.actions{display:flex;gap:8px;align-items:center;}
a{color:#111;text-decoration:none;}
a:hover{text-decoration:underline;}
.help{margin-top:10px;color:#555;font-size:13px;}
</style>
</head>
<body>
  <h1>Browse</h1>
  <div class="toolbar">
    <div class="path-box">{{ current_path }}</div>
    <button type="button" class="select-btn" data-select-value="{{ current_path }}">Select this folder</button>
  </div>

  <div class="list">
    {% if parent_path %}
    <div class="row">
      <div class="name dir"><a href="/browse?path={{ parent_path|urlencode }}&target_id={{ target_id|urlencode }}&select={{ select_mode|urlencode }}">[..]</a></div>
      <div class="actions"></div>
    </div>
    {% endif %}
    {% for entry in entries %}
    <div class="row">
      {% if entry.is_dir %}
      <div class="name dir"><a href="/browse?path={{ entry.path|urlencode }}&target_id={{ target_id|urlencode }}&select={{ select_mode|urlencode }}">{{ entry.name }}/</a></div>
      <div class="actions"><button type="button" class="select-btn" data-select-value="{{ entry.path }}">Select folder</button></div>
      {% else %}
      <div class="name">{{ entry.name }}</div>
      <div class="actions"><button type="button" class="select-btn" data-select-value="{{ entry.path }}">Select file</button></div>
      {% endif %}
    </div>
    {% endfor %}
  </div>

<script>
(function () {
  function writeValue(value) {
    if (!window.opener || window.opener.closed) return;
    const targetId = {{ target_id|tojson }};
    const el = window.opener.document.getElementById(targetId);
    if (!el) return;
    el.value = value;
    try {
      el.dispatchEvent(new Event("input", { bubbles: true }));
      el.dispatchEvent(new Event("change", { bubbles: true }));
    } catch (_e) {}
    window.close();
  }
  document.addEventListener("click", function (event) {
    const btn = event.target.closest(".select-btn");
    if (!btn) return;
    event.preventDefault();
    writeValue(btn.getAttribute("data-select-value") || "");
  });
})();
</script>
</body>
</html>
